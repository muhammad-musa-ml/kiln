<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Saved reels, researched and made useful. Explore practical guides, commands, prompts and project ideas.">
<title>Kiln — research made useful</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css"><script>window.KILN_STATIC=true;window.KILN_BUILT="20 Oct 2026";</script></head>
<body><div class="shell">
<aside class="rail" id="rail" aria-label="Library filters">
 <a class="brand" href="/" aria-label="Kiln home"><span class="mark" aria-hidden="true"></span><span>Kiln<small>saved → useful</small></span></a>
 <button class="rail-home" id="everything">All topics <span id="total"></span></button><div id="facets"></div>
 <div class="rail-foot"><span class="mode" id="mode"></span><button id="howBtn">How Kiln works ↗</button><a href="https://github.com/muhammad-musa-ml/kiln" target="_blank" rel="noopener noreferrer">GitHub ↗</a><span id="built"></span></div>
</aside>
<main>
 <header class="masthead"><div><p class="eyebrow">THE RESEARCH LIBRARY</p><h1>Good ideas.<br><span>Ready to use.</span></h1><p class="intro">Reels become guides, prompts and projects.<br>Overlapping sources become one useful topic.</p></div><div class="header-actions"><button class="button quiet" id="mobileFilters" aria-expanded="false" aria-controls="facets">Filters</button><button class="button primary" id="importBtn" hidden>＋ Import README</button><button class="button quiet" id="inboxBtn" hidden>Research inbox</button><a class="button quiet" href="https://github.com/muhammad-musa-ml/kiln" target="_blank" rel="noopener noreferrer">Explore the code ↗</a></div></header>
 <section class="toolbar" aria-label="Search and sort"><label class="searchbox"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Search topics, tools, commands, prompts…" aria-label="Search library"><kbd>/</kbd></label><label class="sort-label">Sort <select id="sort"><option value="recent">Recently researched</option><option value="title">Title A–Z</option><option value="sources">Most sources</option></select></label></section>
 <nav class="stage-tabs" aria-label="Progress"><button data-stage="" aria-pressed="true">Everything</button><button data-stage="ready">Ready</button><button data-stage="in-progress">In progress</button><button data-stage="made">Made</button><button data-stage="set-aside">Set aside</button><button id="savedBtn" aria-pressed="false">☆ Saved on this device</button></nav>
 <div class="library-heading"><h2 id="heading">All topics</h2><span id="count" aria-live="polite"></span><button id="clear" hidden>Clear filters ×</button></div><div id="activeFilters" class="active-filters"></div>
 <div id="asks"></div><div id="jobs" aria-live="polite"></div><section id="shelf" class="shelf" aria-label="Research topics"></section>
 <footer class="page-foot">A growing library, grounded in sources. <button id="footerHow">See how it works ↗</button></footer>
</main></div><div id="modal"></div><div id="toast" role="status" aria-live="polite"></div><script src="/static/app.js"></script></body></html>
